<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perplexity Exporter</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        min-width: 320px;
        margin: 0;
        padding: 16px;
        background: #0b1020;
        color: #e5e7eb;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 12px;
      }
      .actions {
        display: grid;
        gap: 8px;
      }
      button {
        border: none;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      #exportCurrent {
        background: #60a5fa;
        color: #0b1020;
      }
      #bulkExport {
        background: #34d399;
        color: #0b1020;
      }
      #status {
        margin-top: 12px;
        background: #111827;
        border-radius: 8px;
        padding: 10px;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Perplexity Chat Bulk Exporter</h1>
    <div class="actions">
      <button id="exportCurrent">現在の対話を JSON ダウンロード</button>
      <button id="bulkExport">複数スレッドを ZIP ダウンロード</button>
    </div>
    <div id="status">準備完了</div>
    <script src="popup.js"></script>
  </body>
</html>
